name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv /tmp/huffman-wheel-test
          /tmp/huffman-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/huffman-wheel-test/bin/huffman-protocol --help
          /tmp/huffman-wheel-test/bin/python -c "from importlib.resources import files; p = files('huffman_protocol').joinpath('schemas', 'evidence.schema.json'); assert p.is_file(); print('Evidence schema packaged:', p)"
